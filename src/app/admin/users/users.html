
<main class="users-page">
  <div class="users-heading">
    <div>
      <span class="section-label">ADMINISTRATION</span>
      <h1>Users</h1>
      <p>Manage users and their access to PolicyDesk.</p>
    </div>

    <button type="button" class="add-user-btn" (click)="openAddUser()">
  <span>+</span> Add user
</button>
  </div>

  <section class="users-card">
    <div class="table-heading">
      <h2>All users</h2>
      <span class="user-count">4 users</span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>

       <tbody>
  @for (user of users; track $index) {
    <tr>
      <td>
        <div class="user-name">
          <span class="user-avatar"
            [class.employee]="user.role === 'Employee'"
            [class.manager]="user.role === 'Manager'"
            [class.admin]="user.role === 'Admin'">
            {{ user.name.charAt(0) }}
          </span>
          <strong>{{ user.name }}</strong>
        </div>
      </td>
      <td>{{ user.role }}</td>
      <td>
        <span class="status"
          [class.active]="user.status === 'Active'"
          [class.inactive]="user.status === 'Inactive'">
          {{ user.status }}
        </span>
      </td>
    </tr>
  }
</tbody>
      </table>
    </div>
  </section>
</main>

@if (showAddUserModal) {
  <div class="modal-overlay">
    <section class="add-user-modal">
      <h2>Add new user</h2>
      <p>Enter the details of the new user.</p>

      <form (ngSubmit)="addUser()">
        <label for="newName">Full name</label>
        <input
          id="newName"
          name="name"
          [(ngModel)]="newUser.name"
          placeholder="Enter full name"
          required
        >

        <label for="newRole">Role</label>
        <select id="newRole" name="role" [(ngModel)]="newUser.role">
          <option value="Employee">Employee</option>
          <option value="Manager">Manager</option>
          <option value="Admin">Admin</option>
        </select>

        <label for="newStatus">Status</label>
        <select id="newStatus" name="status" [(ngModel)]="newUser.status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" (click)="closeAddUser()">
            Cancel
          </button>
          <button type="submit" class="add-user-btn">
            Add user
          </button>
        </div>
      </form>
    </section>
  </div>
}
